{% extends "base.html" %}

{% block title %}{{ title }}: WarmBrew SMP{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<section class="wrap error-page" aria-labelledby="error-title">
  <p class="error-page__code">{{ code }}</p>
  <h1 id="error-title">{{ title }}</h1>
  <p>{{ message }}</p>
  <p class="error-page__links">
    <a class="button" href="{{ url_for('index') }}">Back to spawn</a>
    <a class="text-link" href="{{ url_for('forum') }}">Forum</a>
  </p>
</section>
{% endblock %}
